name: Security & Secret Audit

on:
  pull_request:
    branches:
      - main

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan for Hardcoded Secrets
        run: |
          echo "Scanning repository for plain-text secrets..."
          # If any tracked file contains the string "SECRET_KEY_LIVE", fail the build
          if grep -rn . -e "SECRET_KEY_LIVE" --exclude-dir=".git" --exclude-dir=".github"; then
            echo "ERROR: Plaintext secret detected in codebase! Blocking merge."
            exit 1
          else
            echo "SUCCESS: No unencrypted secrets found."
          fi